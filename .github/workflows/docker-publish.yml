# 发布 Docker 镜像到 Docker Hub（多架构：amd64 + arm64，覆盖 x86 服务器与大多数 NAS）
# 触发：推送 v* 标签（如 v1.0.1）或手动触发
# 首次使用前，在 GitHub 仓库 Settings → Secrets and variables → Actions 添加：
#   DOCKERHUB_USERNAME —— Docker Hub 用户名
#   DOCKERHUB_TOKEN    —— Docker Hub → Account Settings → Security → New Access Token 生成的令牌
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/3d-printing-business
          tags: |
            # v1.2.3 → 1.2.3 / 1.2 / 1 / latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
